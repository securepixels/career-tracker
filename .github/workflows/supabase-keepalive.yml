name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 12 */5 * *"  # every 5 days at noon UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Career Tracker
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.CAREER_TRACKER_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.CAREER_TRACKER_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.CAREER_TRACKER_KEY }}"

      - name: Ping Threat Pulse
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.THREAT_PULSE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.THREAT_PULSE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.THREAT_PULSE_KEY }}"
